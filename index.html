<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معدل سنج هوشمند</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Montserrat:wght@800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark-1: #0b0217;
      --bg-dark-2: #1e0836;
      --bg-dark-3: #320d5c;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --font-sport: 'Teko', 'Chakra Petch', sans-serif;
      --font-title-badge: 'Vazirmatn', 'B Titr', 'Titr', sans-serif;
      --font-gpa: 'Vazirmatn', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Shabnam', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-dark-1), var(--bg-dark-2), var(--bg-dark-3), #120124);
      background-size: 300% 300%;
      animation: dynamicGradient 14s ease infinite;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 85px;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    @keyframes dynamicGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* نوار سفید بالا */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      z-index: 1000;
    }

    .brand-title {
      color: #1a1a2e;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-title span.author {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #5a189a;
      font-size: 17px;
      white-space: nowrap;
    }

    .top-links {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 96px;
      height: 38px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .nav-btn.eitaa {
      background: linear-gradient(135deg, #e65100, #f57c00);
      color: #fff;
    }

    .nav-btn.telegram {
      background: linear-gradient(135deg, #0088cc, #00c6ff);
      color: #fff;
    }

    /* بدنه اصلی */
    .main-container {
      width: 92%;
      max-width: 850px;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(255, 255, 255, 0.4), 0 0 40px rgba(199, 125, 255, 0.4);
    }

    /* آیکون‌های ریاضی */
    .math-icon-svg {
      width: 54px;
      height: 54px;
      filter: drop-shadow(0 6px 18px rgba(255, 120, 0, 0.65));
      transition: transform 0.3s ease;
    }

    .math-multiply {
      animation: floatRotateMultiply 4s ease-in-out infinite alternate;
    }

    .math-divide {
      animation: floatBounceDivide 4s ease-in-out infinite alternate;
    }

    @keyframes floatRotateMultiply {
      0% {
        transform: translateY(0px) rotate(-6deg) scale(1);
      }
      100% {
        transform: translateY(-8px) rotate(16deg) scale(1.08);
      }
    }

    @keyframes floatBounceDivide {
      0% {
        transform: translateY(0px) rotate(6deg) scale(1);
      }
      100% {
        transform: translateY(-8px) rotate(-14deg) scale(1.08);
      }
    }

    .subtitle-glass-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 8, 54, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 9px 24px;
      margin-bottom: 26px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .hero-subtitle-text {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* فرم ورودی معدل سنج */
    .calculator-container {
      width: 100%;
      max-width: 680px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .courses-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .course-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      animation: fadeInRow 0.3s ease;
    }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .course-input {
      height: 46px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: #1a0033;
      outline: none;
      transition: all 0.25s ease;
      user-select: text;
    }

    .course-input:focus {
      border-color: #f72585;
      box-shadow: 0 0 12px rgba(247, 37, 133, 0.35);
    }

    .course-input.input-error {
      border-color: #ff0055 !important;
      background: #fff0f3 !important;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.6) !important;
      animation: shakeInput 0.35s ease;
    }

    @keyframes shakeInput {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .input-name {
      flex: 5;
      min-width: 0;
    }

    .input-unit,
    .input-grade {
      flex: 2.2;
      min-width: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #120124;
    }

    .input-unit::placeholder,
    .input-grade::placeholder {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: normal;
      color: #6c757d;
    }

    .btn-delete-course {
      flex-shrink: 0;
      width: 44px;
      height: 46px;
      background: rgba(255, 77, 109, 0.15);
      border: 1.5px solid rgba(255, 77, 109, 0.4);
      border-radius: 12px;
      color: #ff4d6d;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete-course:hover {
      background: #ff4d6d;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.5);
    }

    .validation-alert-box {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 0, 85, 0.15);
      border: 1.5px solid rgba(255, 77, 109, 0.6);
      border-radius: 12px;
      padding: 10px 14px;
      color: #ffccd5;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.25);
      animation: fadeInRow 0.3s ease;
      line-height: 1.6;
    }

    .validation-alert-box.show {
      display: flex;
    }

    .actions-panel {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .panel-btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-add {
      background: linear-gradient(135deg, #f72585, #b5179e);
      box-shadow: 0 6px 18px rgba(247, 37, 133, 0.4);
    }

    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(247, 37, 133, 0.65);
    }

    .btn-calc {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-calc:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(16, 185, 129, 0.65);
    }

    /* باکس نارنجی عضویت در گروه */
    .wide-eitaa-card {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(135deg, #ff6d00, #ff8500, #e65100);
      border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(230, 81, 0, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .wide-eitaa-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(255, 109, 0, 0.65);
    }

    .wide-eitaa-card:active {
      transform: scale(0.98);
    }

    .wide-eitaa-icon {
      font-size: 22px;
      color: #ffffff;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
      transition: transform 0.25s ease;
    }

    .wide-eitaa-card:hover .wide-eitaa-icon {
      transform: scale(1.15) rotate(-8deg);
    }

    .wide-eitaa-text {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* پاپ آپ پایه */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 2, 17, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      padding: 16px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* پاپ آپ نمایش معدل */
    .liquid-modal-card {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-radius: 30px;
      width: 90vw;
      max-width: 360px;
      padding: 34px 22px 26px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
    }

    #resultModal.active .liquid-modal-card {
      transform: scale(1);
    }

    .liquid-modal-card.status-excellent {
      border-color: #06d6a0;
      box-shadow: 0 0 32px rgba(6, 214, 160, 0.45), 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .liquid-modal-card.status-normal {
      border-color: #ffd166;
      box-shadow: 0 0 32px rgba(255, 209, 102, 0.4), 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .liquid-modal-card.status-probation {
      border-color: #ef476f;
      box-shadow: 0 0 32px rgba(239, 71, 111, 0.45), 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-close-corner {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .modal-close-corner:hover {
      background: #ff4d6d;
      border-color: #ff4d6d;
      transform: scale(1.1);
    }

    /* عدد معدل جذاب و کریستالی */
    .modal-gpa-badge {
      font-family: var(--font-gpa);
      font-size: 74px;
      font-weight: 900;
      line-height: 1;
      margin-top: 6px;
      margin-bottom: 6px;
      direction: rtl;
      display: inline-block;
      background: linear-gradient(180deg, #ffffff 25%, #f1f5f9 60%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.55)) drop-shadow(0 6px 20px rgba(0, 0, 0, 0.65));
      letter-spacing: 1px;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-gpa-badge.pop-anim {
      animation: gpaPopNeon 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes gpaPopNeon {
      0% { transform: scale(0.75); filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)); }
      60% { transform: scale(1.14); filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.9)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.55)) drop-shadow(0 6px 20px rgba(0, 0, 0, 0.65)); }
    }

    /* نشانگر وضعیت معدل */
    .modal-status-badge {
      font-family: var(--font-title-badge);
      font-size: 20px;
      font-weight: 900;
      margin-top: 4px;
      margin-bottom: 18px;
      padding: 6px 22px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      letter-spacing: 0.2px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .modal-status-badge.status-excellent-text {
      color: #a7f3d0 !important;
      background: radial-gradient(circle at 50% 50%, rgba(6, 214, 160, 0.28), rgba(6, 214, 160, 0.12));
      border: 1.5px solid rgba(6, 214, 160, 0.65);
      box-shadow: 0 0 20px rgba(6, 214, 160, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      text-shadow: 0 0 12px rgba(6, 214, 160, 0.85);
    }

    .modal-status-badge.status-normal-text {
      color: #fef08a !important;
      background: radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.28), rgba(255, 209, 102, 0.12));
      border: 1.5px solid rgba(255, 209, 102, 0.65);
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.8);
    }

    .modal-status-badge.status-probation-text {
      color: #fecdd3 !important;
      background: radial-gradient(circle at 50% 50%, rgba(239, 71, 111, 0.32), rgba(239, 71, 111, 0.14));
      border: 1.5px solid rgba(239, 71, 111, 0.7);
      box-shadow: 0 0 20px rgba(239, 71, 111, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      text-shadow: 0 0 12px rgba(239, 71, 111, 0.9);
    }

    /* کادر توضیحات نتیجه */
    .modal-result-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.35);
    }

    .result-row-top {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      opacity: 0.95;
    }

    .result-row-bottom {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      line-height: 1.5;
    }

    .result-row-bottom .colored-units,
    .result-row-bottom .colored-term {
      font-weight: 900;
      padding: 0 2px;
    }

    .colored-units.status-excellent-text,
    .colored-term.status-excellent-text {
      color: #06d6a0 !important;
      text-shadow: 0 0 10px rgba(6, 214, 160, 0.7);
    }

    .colored-units.status-normal-text,
    .colored-term.status-normal-text {
      color: #ffd166 !important;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.7);
    }

    .colored-units.status-probation-text,
    .colored-term.status-probation-text {
      color: #ef476f !important;
      text-shadow: 0 0 10px rgba(239, 71, 111, 0.7);
    }

    @media (max-width: 600px) {
      body {
        padding-top: 75px;
      }
      .top-nav {
        height: 60px;
        padding: 0 12px;
      }
      .brand-title {
        font-size: 12px;
        gap: 4px;
      }
      .brand-title span.author {
        font-size: 13.5px;
        letter-spacing: 0.8px;
      }
      .nav-btn {
        width: 76px;
        height: 32px;
        font-size: 11.5px;
        border-radius: 8px;
      }
      .hero-title { font-size: 38px; }
      .math-icon-svg { width: 44px; height: 44px; }
      .hero-subtitle-text { font-size: 12px; }
      .subtitle-glass-capsule { padding: 7px 16px; margin-bottom: 20px; }

      .calculator-container {
        padding: 16px 12px;
        margin-bottom: 16px;
      }
      .course-row {
        gap: 6px;
      }
      .course-input {
        height: 42px;
        font-size: 12.5px;
        padding: 0 8px;
      }
      .input-unit,
      .input-grade {
        font-size: 15px;
      }
      .input-unit::placeholder,
      .input-grade::placeholder {
        font-size: 12px;
      }
      .btn-delete-course {
        width: 38px;
        height: 42px;
        font-size: 13.5px;
      }
      .panel-btn {
        height: 44px;
        font-size: 13.5px;
      }
      .wide-eitaa-card {
        padding: 13px 14px;
        border-radius: 16px;
      }
      .wide-eitaa-text {
        font-size: 13.5px;
      }
      .wide-eitaa-icon {
        font-size: 19px;
      }

      .liquid-modal-card {
        max-width: 320px;
        padding: 26px 16px 20px 16px;
        border-radius: 24px;
      }
      .modal-gpa-badge {
        font-size: 60px;
        margin-top: 4px;
        margin-bottom: 4px;
      }
      .modal-status-badge {
        font-size: 17px;
        padding: 5px 18px;
        margin-bottom: 15px;
      }
      .result-row-top {
        font-size: 12px;
      }
      .result-row-bottom {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- نوار سفید بالا -->
  <header class="top-nav">
    <div class="brand-title">
      ایده و طراحی توسط <span class="author">ARMOON</span>
    </div>
    <div class="top-links">
      <a href="https://eitaa.com/arm00n" target="_blank" class="nav-btn eitaa">
        <i class="fa-solid fa-paper-plane"></i> ایتا
      </a>
      <a href="https://t.me/iamarmoon" target="_blank" class="nav-btn telegram">
        <i class="fa-brands fa-telegram"></i> تلگرام
      </a>
    </div>
  </header>

  <main class="main-container">
    <div class="brand-hero">
      <!-- آیکون ضرب -->
      <svg class="math-icon-svg math-multiply" viewBox="0 0 100 100" fill="none">
        <defs>

          <circle cx="50" cy="26" r="6" fill="url(#divGradInner)"/>
          <circle cx="48" cy="24" r="2.5" fill="#ffffff" opacity="0.85"/>
          <circle cx="50" cy="73" r="9" fill="url(#divGradOuter)"/>

    </div>

    <div class="subtitle-glass-capsule">
      <span class="hero-subtitle-text">محاسبه هوشمند معدل و سقف انتخاب واحد ترم آینده</span>
    </div>

    <!-- فرم ورودی معدل سنج -->
    <div class="calculator-container">
      <div class="courses-list" id="coursesList"></div>

      <!-- پیام خطای اعتبارسنجی ورودی -->
      <div class="validation-alert-box" id="validationAlert">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="validationAlertText">نمره و تعداد واحد دروس حتما باید وارد شوند</span>
      </div>

      <div class="actions-panel">
        <button type="button" class="panel-btn btn-add" id="addCourseBtn">
          <i class="fa-solid fa-plus"></i> افزودن درس
        </button>
        <button type="button" class="panel-btn btn-calc" id="calculateBtn">
          <i class="fa-solid fa-calculator"></i> محاسبه معدل
        </button>
      </div>
    </div>

    <!-- باکس کشیده نارنجی گروه دانشجویان -->
    <a href="https://eitaa.com/joinchat/137627106Ccda4d2e78d" target="_blank" class="wide-eitaa-card">
      <i class="fa-solid fa-users wide-eitaa-icon"></i>
      <span class="wide-eitaa-text">عضویت در گروه دانشجویان پیام نور قزوین</span>
    </a>
  </main>

  <!-- پاپ آپ نمایش نتیجه معدل سنج -->
  <div id="resultModal" class="modal-overlay">
    <div class="liquid-modal-card" id="liquidModalCard">
      <button class="modal-close-corner" id="closeResultModal" title="بستن">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- عدد معدل -->
      <div class="modal-gpa-badge" id="modalGpaValue">۰۰.۰۰</div>
      
      <!-- نشانگر وضعیت معدل -->
      <div class="modal-status-badge" id="modalStatusBadge"></div>
      
      <!-- کادر توضیحات نتیجه -->
      <div class="modal-result-box">
        <div class="result-row-top">شما مجاز به انتخاب واحد تا حداکثر</div>
        <div class="result-row-bottom" id="modalResultBottom"></div>
      </div>
    </div>
  </div>

  <script>
    // توابع تبدیل اعداد انگلیسی به فارسی و بالعکس
    const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    function toFarsiNumber(n) {
      return n.toString().replace(/[0-9]/g, x => farsiDigits[x]);
    }

    function toEnglishNumber(str) {
      if (!str) return '';
      return str
        .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776)
        .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
        .replace(/[\/،]/g, '.');
    }

    // عناصر معدل سنج
    const coursesList = document.getElementById('coursesList');
    const addCourseBtn = document.getElementById('addCourseBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const validationAlert = document.getElementById('validationAlert');
    const validationAlertText = document.getElementById('validationAlertText');
    const resultModal = document.getElementById('resultModal');
    const liquidModalCard = document.getElementById('liquidModalCard');
    const closeResultModal = document.getElementById('closeResultModal');
    const modalStatusBadge = document.getElementById('modalStatusBadge');
    const modalGpaValue = document.getElementById('modalGpaValue');
    const modalResultBottom = document.getElementById('modalResultBottom');

    function createCourseRow() {
      const row = document.createElement('div');
      row.className = 'course-row';

      row.innerHTML = `
        <input type="text" class="course-input input-name" placeholder="نام درس">
        <input type="text" inputmode="numeric" class="course-input input-unit" placeholder="واحد">
        <input type="text" inputmode="decimal" class="course-input input-grade" placeholder="نمره">
        <button type="button" class="btn-delete-course" title="حذف درس">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      `;

      const unitInput = row.querySelector('.input-unit');
      const gradeInput = row.querySelector('.input-grade');

      // تبدیل در لحظه اعداد ورودی به کاراکترهای فارسی
      unitInput.addEventListener('input', function() {
        let val = this.value;
        val = toEnglishNumber(val).replace(/[^0-9]/g, '');
        this.value = toFarsiNumber(val);
      });

      gradeInput.addEventListener('input', function() {
        let val = this.value;
        let converted = toEnglishNumber(val).replace(/[^0-9.]/g, '');
        const parts = converted.split('.');
        if (parts.length > 2) {
          converted = parts[0] + '.' + parts.slice(1).join('');
        }
        let farsiFormatted = '';
        for (let char of converted) {
          if (char >= '0' && char <= '9') {
            farsiFormatted += farsiDigits[char];
          } else {
            farsiFormatted += char;
          }
        }
        this.value = farsiFormatted;
      });

      row.querySelectorAll('.course-input').forEach(input => {
        input.addEventListener('input', () => {
          input.classList.remove('input-error');
          if (!coursesList.querySelector('.input-error')) {
            validationAlert.classList.remove('show');
          }
        });
      });

      row.querySelector('.btn-delete-course').addEventListener('click', () => {
        row.remove();
        if (!coursesList.querySelector('.input-error')) {
          validationAlert.classList.remove('show');
        }
      });

      coursesList.appendChild(row);
    }

    for (let i = 0; i < 5; i++) {
      createCourseRow();
    }

    addCourseBtn.addEventListener('click', createCourseRow);

    let gpaAnimId = null;
    function animateGpaNumber(targetVal, duration = 900) {
      if (gpaAnimId) cancelAnimationFrame(gpaAnimId);
      const startTime = performance.now();
      modalGpaValue.classList.remove('pop-anim');
      void modalGpaValue.offsetWidth;
      modalGpaValue.classList.add('pop-anim');

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentVal = easeOut * targetVal;

        modalGpaValue.textContent = toFarsiNumber(currentVal.toFixed(2));

        if (progress < 1) {
          gpaAnimId = requestAnimationFrame(update);
        } else {
          modalGpaValue.textContent = toFarsiNumber(targetVal.toFixed(2));
          gpaAnimId = null;
        }
      }

      gpaAnimId = requestAnimationFrame(update);
    }

    calculateBtn.addEventListener('click', () => {
      coursesList.querySelectorAll('.course-input').forEach(inp => inp.classList.remove('input-error'));
      validationAlert.classList.remove('show');

      const rows = coursesList.querySelectorAll('.course-row');
      let totalWeightedGrade = 0;
      let totalUnits = 0;
      let validFilledRowsCount = 0;
      let hasIncompleteRow = false;
      let hasInvalidUnit = false;
      let hasInvalidGrade = false;

      rows.forEach(row => {
        const unitInput = row.querySelector('.input-unit');
        const gradeInput = row.querySelector('.input-grade');

        const unitRaw = toEnglishNumber(unitInput.value.trim());
        const gradeRaw = toEnglishNumber(gradeInput.value.trim());

        const unitHasVal = unitRaw !== '';
        const gradeHasVal = gradeRaw !== '';

        if ((unitHasVal && !gradeHasVal) || (!unitHasVal && gradeHasVal)) {
          hasIncompleteRow = true;
          if (!unitHasVal) unitInput.classList.add('input-error');
          if (!gradeHasVal) gradeInput.classList.add('input-error');
          return;
        }

        if (unitHasVal && gradeHasVal) {
          const unitVal = parseFloat(unitRaw);
          const gradeVal = parseFloat(gradeRaw);
          let rowHasErr = false;

          // بررسی محدوده تعداد واحد (1 تا 4)
          if (isNaN(unitVal) || unitVal < 1 || unitVal > 4) {
            unitInput.classList.add('input-error');
            hasInvalidUnit = true;
            rowHasErr = true;
          }

          // بررسی محدوده نمره (0 تا 20)
          if (isNaN(gradeVal) || gradeVal < 0 || gradeVal > 20) {
            gradeInput.classList.add('input-error');
            hasInvalidGrade = true;
            rowHasErr = true;
          }

          if (!rowHasErr) {
            totalWeightedGrade += gradeVal * unitVal;
            totalUnits += unitVal;
            validFilledRowsCount++;
          }
        }
      });

      // بررسی عدم ورود همزمان واحد و نمره
      if (hasIncompleteRow) {
        validationAlertText.textContent = 'نمره و تعداد واحد دروس حتما باید وارد شوند';
        validationAlert.classList.add('show');
        return;
      }

      // بررسی خطا در محدوده مقادیر واحد یا نمره
      if (hasInvalidUnit || hasInvalidGrade) {
        if (hasInvalidUnit && hasInvalidGrade) {
          validationAlertText.textContent = 'خطا: تعداد واحد باید بین ۱ تا ۴ و نمره باید بین ۰ تا ۲۰ باشد!';
        } else if (hasInvalidUnit) {
          validationAlertText.textContent = 'خطا: تعداد واحد باید بین ۱ تا ۴ باشد!';
        } else {
          validationAlertText.textContent = 'خطا: نمره باید بین ۰ تا ۲۰ باشد!';
        }
        validationAlert.classList.add('show');
        return;
      }

      // اگر هیچ درسی پر نشده باشد
      if (validFilledRowsCount === 0 || totalUnits === 0) {
        const firstRow = coursesList.querySelector('.course-row');
        if (firstRow) {
          firstRow.querySelector('.input-unit').classList.add('input-error');
          firstRow.querySelector('.input-grade').classList.add('input-error');
        }
        validationAlertText.textContent = 'نمره و تعداد واحد دروس حتما باید وارد شوند';
        validationAlert.classList.add('show');
        return;
      }

      const gpa = totalWeightedGrade / totalUnits;
      let maxUnits = 14;
      let statusText = '';
      let statusClass = '';
      let textClass = '';

      if (gpa >= 17) {
        maxUnits = 24;
        statusText = 'معدل الف';
        statusClass = 'status-excellent';
        textClass = 'status-excellent-text';
      } else if (gpa >= 12) {
        maxUnits = 20;
        statusText = 'معدل عادی';
        statusClass = 'status-normal';
        textClass = 'status-normal-text';
      } else {
        maxUnits = 14;
        statusText = 'معدل مشروط';
        statusClass = 'status-probation';
        textClass = 'status-probation-text';
      }

      liquidModalCard.classList.remove('status-excellent', 'status-normal', 'status-probation');
      liquidModalCard.classList.add(statusClass);

      modalStatusBadge.className = `modal-status-badge ${textClass}`;
      modalStatusBadge.textContent = statusText;

      modalResultBottom.innerHTML = `<span class="colored-units ${textClass}">${toFarsiNumber(maxUnits)} واحد درسی</span> در <span class="colored-term ${textClass}">ترم مهر/بهمن</span> میباشید.`;

      resultModal.classList.add('active');
      animateGpaNumber(gpa, 850);
    });

    closeResultModal.addEventListener('click', () => {
      resultModal.classList.remove('active');
      if (gpaAnimId) cancelAnimationFrame(gpaAnimId);
    });

    resultModal.addEventListener('click', (e) => {
      if (e.target === resultModal) {
        resultModal.classList.remove('active');
        if (gpaAnimId) cancelAnimationFrame(gpaAnimId);
      }
    });
  </script>
</body>
